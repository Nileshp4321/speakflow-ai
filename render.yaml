services:
  # Backend API with WebSocket support
  - type: web
    name: speakflow-ai-server
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel URL

  # Optional: Deploy frontend as static site
  # Uncomment if you want both on Render
